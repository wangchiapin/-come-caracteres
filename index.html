<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>吃字小精靈 · Come Caracteres</title>
<style>
html{color-scheme:light}
:root{--bg:#f5f2ea;--paper:#faf8f3;--ink:#3b3935;--line:#cfc8b8;--sub:#8a8478;--ok:#6b8e6b;--bad:#b5605a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:8px 8px calc(8px + env(safe-area-inset-bottom));position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:2px 4px 6px;color:var(--sub)}
#hud b{color:var(--ink);font-size:18px;font-weight:600}
#lives{letter-spacing:2px;color:var(--bad);font-size:18px}
#prompt{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:56px}
#speak{border:1px solid var(--line);background:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;flex:none;cursor:pointer}
#speak.hide{display:none}
#ptext{flex:1;font-size:17px;line-height:1.3}
#ptext .es{font-weight:600;font-size:20px}
#ptext .py{color:var(--sub);font-size:14px;margin-left:6px}
#fb{font-size:13px;color:var(--sub);min-height:16px}
#fb.ok{color:var(--ok)} #fb.bad{color:var(--bad)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:8px}
canvas{display:block;background:var(--paper);border-radius:8px}
#ov{position:absolute;inset:0;background:rgba(245,242,234,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#ov.show{display:flex}
.card{width:100%;max-width:360px;text-align:center}
.card h1{margin:0 0 2px;font-size:30px;font-weight:600;letter-spacing:2px}
.card h2{margin:0 0 14px;font-size:15px;font-weight:400;color:var(--sub)}
.card p{font-size:13px;color:var(--sub);line-height:1.6;margin:10px 0}
.row{display:flex;gap:8px;margin:8px 0}
.row button{flex:1}
button.opt,button.main{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 6px;cursor:pointer;font-size:14px}
button.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.main{width:100%;background:var(--ink);color:#fff;border-color:var(--ink);font-size:17px;padding:13px;margin-top:10px}
button.sub{width:100%;margin-top:8px;background:transparent;color:var(--sub);border:none;font:inherit;font-size:14px;padding:8px;cursor:pointer}
label.chk{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--sub);margin:10px 0}
.lab{font-size:12px;color:var(--sub);text-align:left;margin-top:10px}
.big{font-size:44px;font-weight:600;margin:4px 0}
.miss{max-height:34vh;overflow:auto;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.8;touch-action:pan-y}
.miss .zh{font-size:17px;font-weight:600;margin-right:6px}
.miss .py{color:var(--sub);margin-right:6px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span>Puntos <b id="score">0</b></span>
    <span id="lives"></span>
    <span>Nivel <b id="stagev">1</b></span>
  </div>
  <div id="prompt">
    <button id="speak" class="hide" aria-label="Escuchar">🔊</button>
    <div id="ptext"></div>
  </div>
  <div id="fb"></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="ov"></div>
</div>

<script>
/* =====================================================
   吃字小精靈 · Come Caracteres
   單一 HTML。第一版：排行榜只存本機最高分（未接 Firebase）
   ===================================================== */

/* ---------- 字庫（範例，之後可換成「總字庫」） ---------- */
const BANK=[
 // 初級：單字
 {l:1,zh:'一',py:'yī',es:'uno'},{l:1,zh:'二',py:'èr',es:'dos'},{l:1,zh:'三',py:'sān',es:'tres'},
 {l:1,zh:'四',py:'sì',es:'cuatro'},{l:1,zh:'五',py:'wǔ',es:'cinco'},
 {l:1,zh:'人',py:'rén',es:'persona'},{l:1,zh:'大',py:'dà',es:'grande'},{l:1,zh:'小',py:'xiǎo',es:'pequeño'},
 {l:1,zh:'水',py:'shuǐ',es:'agua'},{l:1,zh:'火',py:'huǒ',es:'fuego'},{l:1,zh:'山',py:'shān',es:'montaña'},
 {l:1,zh:'月',py:'yuè',es:'luna'},{l:1,zh:'日',py:'rì',es:'sol / día'},{l:1,zh:'口',py:'kǒu',es:'boca'},
 {l:1,zh:'手',py:'shǒu',es:'mano'},{l:1,zh:'心',py:'xīn',es:'corazón'},{l:1,zh:'木',py:'mù',es:'árbol / madera'},
 {l:1,zh:'門',py:'mén',es:'puerta'},{l:1,zh:'雨',py:'yǔ',es:'lluvia'},{l:1,zh:'狗',py:'gǒu',es:'perro'},
 {l:1,zh:'貓',py:'māo',es:'gato'},{l:1,zh:'魚',py:'yú',es:'pez'},{l:1,zh:'鳥',py:'niǎo',es:'pájaro'},
 {l:1,zh:'車',py:'chē',es:'carro'},{l:1,zh:'飯',py:'fàn',es:'arroz / comida'},{l:1,zh:'茶',py:'chá',es:'té'},
 {l:1,zh:'書',py:'shū',es:'libro'},{l:1,zh:'家',py:'jiā',es:'casa'},{l:1,zh:'好',py:'hǎo',es:'bueno'},
 // 中級：兩字詞
 {l:2,zh:'老師',py:'lǎoshī',es:'profesor'},{l:2,zh:'學生',py:'xuéshēng',es:'estudiante'},
 {l:2,zh:'朋友',py:'péngyǒu',es:'amigo'},{l:2,zh:'蘋果',py:'píngguǒ',es:'manzana'},
 {l:2,zh:'牛奶',py:'niúnǎi',es:'leche'},{l:2,zh:'電話',py:'diànhuà',es:'teléfono'},
 {l:2,zh:'學校',py:'xuéxiào',es:'escuela'},{l:2,zh:'醫院',py:'yīyuàn',es:'hospital'},
 {l:2,zh:'咖啡',py:'kāfēi',es:'café'},{l:2,zh:'手機',py:'shǒujī',es:'celular'},
 {l:2,zh:'火車',py:'huǒchē',es:'tren'},{l:2,zh:'捷運',py:'jiéyùn',es:'metro (MRT)'},
 {l:2,zh:'便當',py:'biàndāng',es:'lonche (bento)'},{l:2,zh:'夜市',py:'yèshì',es:'mercado nocturno'},
 {l:2,zh:'早餐',py:'zǎocān',es:'desayuno'},{l:2,zh:'天氣',py:'tiānqì',es:'clima'},
 {l:2,zh:'眼睛',py:'yǎnjīng',es:'ojos'},{l:2,zh:'冰箱',py:'bīngxiāng',es:'refrigerador'},
 {l:2,zh:'椅子',py:'yǐzi',es:'silla'},{l:2,zh:'桌子',py:'zhuōzi',es:'mesa'},
 // 高級
 {l:3,zh:'方便',py:'fāngbiàn',es:'conveniente'},{l:3,zh:'麻煩',py:'máfan',es:'molestia / problema'},
 {l:3,zh:'習慣',py:'xíguàn',es:'costumbre / acostumbrarse'},{l:3,zh:'經驗',py:'jīngyàn',es:'experiencia'},
 {l:3,zh:'需要',py:'xūyào',es:'necesitar'},{l:3,zh:'決定',py:'juédìng',es:'decidir'},
 {l:3,zh:'容易',py:'róngyì',es:'fácil'},{l:3,zh:'重要',py:'zhòngyào',es:'importante'},
 {l:3,zh:'健康',py:'jiànkāng',es:'salud'},{l:3,zh:'環境',py:'huánjìng',es:'medio ambiente'},
 {l:3,zh:'準備',py:'zhǔnbèi',es:'preparar'},{l:3,zh:'擔心',py:'dānxīn',es:'preocuparse'},
 {l:3,zh:'邀請',py:'yāoqǐng',es:'invitar'},{l:3,zh:'比賽',py:'bǐsài',es:'competencia'},
 {l:3,zh:'機會',py:'jīhuì',es:'oportunidad'}
];

/* ---------- 地圖 15 x 17（# 牆；第 8 列兩側是穿越隧道） ---------- */
const MAP=[
 "###############",
 "#......#......#",
 "#.####.#.####.#",
 "#.............#",
 "#.##.#...#.##.#",
 "#....#...#....#",
 "####.#...#.####",
 "####.#.#.#.####",
 ".....#...#.....",
 "####.#.#.#.####",
 "####.#...#.####",
 "#....#...#....#",
 "#.##.#...#.##.#",
 "#.............#",
 "#.####.#.####.#",
 "#......#......#",
 "###############"
];
const COLS=15,ROWS=17,TUNNEL=8;
const PLAYER_START=[7,13];
const HOMES=[[7,8],[6,8],[8,8],[7,6]];
const grid=MAP.map(r=>r.split(''));
function isWall(x,y){
  if(y===TUNNEL&&(x<0||x>=COLS))return false;
  if(x<0||x>=COLS||y<0||y>=ROWS)return true;
  return grid[y][x]==='#';
}
const wrapX=x=>(x+COLS)%COLS;
const SPAWN=[];
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  if(grid[y][x]==='#')continue;
  if(x>=5&&x<=9&&y>=4&&y<=12)continue;
  if(y===TUNNEL&&(x===0||x===COLS-1))continue;
  if(x===PLAYER_START[0]&&y===PLAYER_START[1])continue;
  SPAWN.push([x,y]);
}

/* ---------- 小工具 ---------- */
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const cfg=Object.assign({mode:'text',level:1,pinyin:false},lsGet('cc_cfg',{}));
let best=lsGet('cc_best',0);

/* ---------- 聲音 ---------- */
let ac;
function beep(f,d,type,v,slide){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  ok(){beep(660,.12,'sine',.06);setTimeout(()=>beep(880,.15,'sine',.06),90);},
  bad(){beep(200,.22,'sawtooth',.04,140);},
  hit(){beep(320,.45,'square',.04,70);},
  power(){beep(520,.3,'triangle',.06,1040);},
  eatM(){beep(400,.2,'square',.04,900);}
};
let ttsWarned=false;
function speak(t){
  if(!('speechSynthesis' in window)){warnTTS();return;}
  try{
    const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.85;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang));
    if(v)u.voice=v; else warnTTS();
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function warnTTS(){
  if(ttsWarned)return;ttsWarned=true;
  setFb('Tu dispositivo no tiene voz en chino de Taiwán (zh-TW).','bad');
}

/* ---------- 實體移動（格子到格子，平滑） ---------- */
function makeEnt(x,y,speed){return {tx:x,ty:y,nx:x,ny:y,prog:0,dx:0,dy:0,speed};}
function resetEnt(e,x,y){e.tx=x;e.ty=y;e.nx=x;e.ny=y;e.prog=0;e.dx=0;e.dy=0;}
function setDir(e,dx,dy){e.dx=dx;e.dy=dy;e.nx=e.tx+dx;e.ny=e.ty+dy;}
function pos(e){return {x:e.tx+(e.nx-e.tx)*e.prog,y:e.ty+(e.ny-e.ty)*e.prog};}
function stepEnt(e,dt,pick){
  let move=e.speed*dt,guard=0;
  while(move>0&&guard++<8){
    if(e.dx===0&&e.dy===0){
      pick(e);
      if(e.dx===0&&e.dy===0)return;
      e.prog=0;
    }
    const need=1-e.prog;
    if(move>=need){
      move-=need;
      e.tx=wrapX(e.nx);e.ty=e.ny;e.prog=0;
      pick(e);
      if(e.dx===0&&e.dy===0){e.nx=e.tx;e.ny=e.ty;return;}
    }else{e.prog+=move;move=0;}
  }
}
function pickPlayer(e){
  const w=P.want;
  if(w&&!isWall(e.tx+w[0],e.ty+w[1])){setDir(e,w[0],w[1]);return;}
  if((e.dx||e.dy)&&!isWall(e.tx+e.dx,e.ty+e.dy)){setDir(e,e.dx,e.dy);return;}
  e.dx=0;e.dy=0;
}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function pickMonster(m){
  let opts=DIRS.filter(d=>!isWall(m.tx+d[0],m.ty+d[1]));
  const fwd=opts.filter(d=>!((m.dx||m.dy)&&d[0]===-m.dx&&d[1]===-m.dy));
  if(fwd.length)opts=fwd;
  if(!opts.length){m.dx=0;m.dy=0;return;}
  const d=opts[rnd(opts.length)];
  setDir(m,d[0],d[1]);
}
function setWant(dx,dy){
  if(state!=='play'||!P)return;
  P.want=[dx,dy];
  // 移動中直接回頭
  if((P.dx||P.dy)&&dx===-P.dx&&dy===-P.dy){
    const ntx=P.nx,nty=P.ny;
    if(ntx<0||ntx>=COLS)return;
    P.nx=P.tx;P.ny=P.ty;P.tx=ntx;P.ty=nty;P.prog=1-P.prog;P.dx=-P.dx;P.dy=-P.dy;
  }
}

/* ---------- 遊戲狀態 ---------- */
let state='menu',G=null,P=null;
const MCOLORS=['#8c6f5a','#6f8a8c','#9a7b86','#8a8f6a'];
function monstersForStage(s){return s>=5?4:s>=3?3:2;}
function monsterBase(){return Math.min(4.6,3.1+.25*(G.stage-1));}

function addMonster(i,wait){
  const h=HOMES[i%HOMES.length];
  const m=makeEnt(h[0],h[1],3.1);
  m.color=MCOLORS[i%4];m.home=h;m.wait=wait;
  G.monsters.push(m);
}
function startGame(){
  G={score:0,lives:3,stage:1,correct:0,combo:0,items:[],monsters:[],pops:[],mistakes:[],
     q:null,lastZh:'',invincible:0,fright:0,freeze:1.4,banner:'¡Listo!',bannerT:1.4,time:0,flash:0};
  P=makeEnt(PLAYER_START[0],PLAYER_START[1],5.2);P.want=null;P.face=Math.PI;
  const n=monstersForStage(1);
  for(let i=0;i<n;i++)addMonster(i,1.5+i*3);
  state='play';
  $('ov').classList.remove('show');
  updateHud();newQuestion();
}

function freeCell(minDist){
  const occ=new Set(G.items.map(i=>i.x+','+i.y));
  const pp=pos(P);
  const c=SPAWN.filter(([x,y])=>!occ.has(x+','+y)&&Math.abs(x-pp.x)+Math.abs(y-pp.y)>=minDist);
  return c.length?c[rnd(c.length)]:SPAWN[rnd(SPAWN.length)];
}
function pickDistractor(q){
  const pool=BANK.filter(w=>w.l===cfg.level&&w.zh!==q.zh&&![...w.zh].some(ch=>q.zh.includes(ch)));
  const used=new Set(G.items.map(i=>i.zh));
  const c=pool.filter(w=>!used.has(w.zh));
  return (c.length?c:pool)[rnd((c.length?c:pool).length)];
}
function addItem(w,kind){
  const [x,y]=freeCell(5);
  G.items.push({x,y,zh:w.zh,py:w.py,kind,t:kind==='power'?14:0,seed:Math.random()*6});
}
function newQuestion(){
  const pool=BANK.filter(w=>w.l===cfg.level);
  let w;do{w=pool[rnd(pool.length)];}while(w.zh===G.lastZh&&pool.length>1);
  G.lastZh=w.zh;G.q=w;G.q.missed=false;
  G.items=G.items.filter(i=>i.kind==='power');
  addItem(w,'ok');
  for(let i=0;i<3;i++)addItem(pickDistractor(w),'bad');
  renderPrompt();
  if(cfg.mode==='listen')speak(w.zh);
}
function renderPrompt(){
  const q=G.q;
  $('speak').classList.toggle('hide',cfg.mode!=='listen');
  if(cfg.mode==='listen'){
    $('ptext').innerHTML='<span class="es">Escucha y come el carácter</span>'+(cfg.pinyin?`<span class="py">${esc(q.py)}</span>`:'');
  }else{
    $('ptext').innerHTML=`Come → <span class="es">${esc(q.es)}</span>`+(cfg.pinyin?`<span class="py">${esc(q.py)}</span>`:'');
  }
}
let fbTimer=0;
function setFb(t,cls){
  const f=$('fb');f.textContent=t;f.className=cls||'';
  clearTimeout(fbTimer);fbTimer=setTimeout(()=>{f.textContent='';},2200);
}
function updateHud(){
  $('score').textContent=G.score;
  $('stagev').textContent=G.stage;
  $('lives').textContent='♥'.repeat(G.lives)+'♡'.repeat(Math.max(0,3-G.lives));
}
function pop(x,y,text,color){G.pops.push({x:(x+.5)*cell,y:(y+.5)*cell,text,color,t:1});}

/* ---------- 吃字與碰撞 ---------- */
function eatItem(it){
  const pp=pos(P);
  G.items.splice(G.items.indexOf(it),1);
  if(it.kind==='ok'){
    G.combo++;
    const pts=100+Math.min(G.combo-1,9)*10;
    G.score+=pts;G.correct++;
    pop(it.x,it.y,'+'+pts,'#6b8e6b');sfx.ok();
    setFb(`✓ ${G.q.zh}  ${G.q.py}  =  ${G.q.es}`,'ok');
    if(G.correct%3===0&&!G.items.some(i=>i.kind==='power'))addItem({zh:'力',py:'lì'},'power');
    if(G.correct%8===0){
      G.stage++;G.banner='Nivel '+G.stage;G.bannerT=1.6;
      if(G.monsters.length<monstersForStage(G.stage))addMonster(G.monsters.length,2);
    }
    updateHud();newQuestion();
  }else if(it.kind==='bad'){
    G.combo=0;G.score=Math.max(0,G.score-50);G.flash=.35;
    pop(it.x,it.y,'-50','#b5605a');sfx.bad();
    setFb(`✗ ${it.zh}  ${it.py}`,'bad');
    if(!G.q.missed){
      G.q.missed=true;
      if(!G.mistakes.some(m=>m.zh===G.q.zh))G.mistakes.push({zh:G.q.zh,py:G.q.py,es:G.q.es});
    }
    addItem(pickDistractor(G.q),'bad');
    updateHud();
  }else{
    G.fright=8;G.score+=50;pop(it.x,it.y,'+50','#b08d3c');sfx.power();updateHud();
  }
}
function eatMonster(m){
  G.score+=200;pop(pos(m).x,pos(m).y,'+200','#b08d3c');sfx.eatM();
  resetEnt(m,m.home[0],m.home[1]);m.wait=3;updateHud();
}
function resetPositions(){
  resetEnt(P,PLAYER_START[0],PLAYER_START[1]);P.want=null;P.face=Math.PI;
  G.monsters.forEach((m,i)=>{resetEnt(m,m.home[0],m.home[1]);m.wait=1.5+i*2;});
  G.fright=0;
}
function hitPlayer(){
  G.lives--;G.combo=0;G.flash=.5;sfx.hit();updateHud();
  if(G.lives<=0){gameOver();return;}
  resetPositions();G.invincible=2.6;G.freeze=.9;
}
function gameOver(){
  state='over';
  saveScore(G.score);
  showOver();
}
function saveScore(s){
  if(s>best){best=s;lsSet('cc_best',best);}
  // TODO（之後接 Firebase 排行榜）：在這裡把 s 寫進 leaderboard collection
}

/* ---------- 更新 ---------- */
function update(dt){
  G.time+=dt;
  if(G.bannerT>0)G.bannerT-=dt;
  if(G.flash>0)G.flash-=dt;
  G.pops.forEach(p=>{p.t-=dt*1.1;p.y-=dt*24;});
  G.pops=G.pops.filter(p=>p.t>0);
  if(G.freeze>0){G.freeze-=dt;return;}
  if(G.invincible>0)G.invincible-=dt;
  if(G.fright>0)G.fright=Math.max(0,G.fright-dt);

  stepEnt(P,dt,pickPlayer);
  if(P.dx||P.dy)P.face=Math.atan2(P.dy,P.dx);
  const spd=monsterBase()*(G.fright>0?.6:1);
  for(const m of G.monsters){
    if(m.wait>0){m.wait-=dt;continue;}
    m.speed=spd;stepEnt(m,dt,pickMonster);
  }
  for(const it of G.items.slice()){
    if(it.kind==='power'){it.t-=dt;if(it.t<=0){G.items.splice(G.items.indexOf(it),1);continue;}}
  }
  const pp=pos(P);
  for(const it of G.items.slice()){
    if(Math.hypot(pp.x-it.x,pp.y-it.y)<.55){eatItem(it);if(state!=='play')return;}
  }
  for(const m of G.monsters){
    if(m.wait>0)continue;
    const mp=pos(m);
    if(Math.hypot(pp.x-mp.x,pp.y-mp.y)<.62){
      if(G.fright>0)eatMonster(m);
      else if(G.invincible<=0){hitPlayer();break;}
    }
  }
}

/* ---------- 繪圖 ---------- */
let cell=24,dpr=1;
function resize(){
  const st=$('stage');
  const w=st.clientWidth,h=st.clientHeight;
  cell=Math.max(12,Math.floor(Math.min(w/COLS,h/ROWS)));
  dpr=window.devicePixelRatio||1;
  cv.style.width=cell*COLS+'px';cv.style.height=cell*ROWS+'px';
  cv.width=cell*COLS*dpr;cv.height=cell*ROWS*dpr;
}
window.addEventListener('resize',resize);
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

function drawMaze(){
  ctx.fillStyle='#faf8f3';ctx.fillRect(0,0,COLS*cell,ROWS*cell);
  ctx.fillStyle='#e6e1d4';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x]==='#')ctx.fillRect(x*cell,y*cell,cell,cell);
  ctx.strokeStyle='#a39b8a';ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]!=='#')continue;
    const X=x*cell,Y=y*cell;
    const open=(a,b)=>a>=0&&a<COLS&&b>=0&&b<ROWS&&grid[b][a]!=='#';
    if(open(x,y-1)){ctx.moveTo(X,Y);ctx.lineTo(X+cell,Y);}
    if(open(x,y+1)){ctx.moveTo(X,Y+cell);ctx.lineTo(X+cell,Y+cell);}
    if(open(x-1,y)){ctx.moveTo(X,Y);ctx.lineTo(X,Y+cell);}
    if(open(x+1,y)){ctx.moveTo(X+cell,Y);ctx.lineTo(X+cell,Y+cell);}
  }
  ctx.stroke();
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawItem(it){
  const s=cell*.92,x=it.x*cell+(cell-s)/2,y=it.y*cell+(cell-s)/2;
  const power=it.kind==='power';
  let alpha=1;
  if(power&&it.t<3)alpha=Math.sin(G.time*14)>0?1:.35;
  ctx.globalAlpha=alpha;
  if(power){
    const k=1+Math.sin(G.time*5+it.seed)*.06;
    ctx.save();ctx.translate((it.x+.5)*cell,(it.y+.5)*cell);ctx.scale(k,k);ctx.translate(-(it.x+.5)*cell,-(it.y+.5)*cell);
  }
  rr(x,y,s,s,s*.22);
  ctx.fillStyle=power?'#efe3c2':'#ffffff';ctx.fill();
  ctx.strokeStyle=power?'#b08d3c':'#8a8478';ctx.lineWidth=power?2:1.2;ctx.stroke();
  const n=[...it.zh].length;
  ctx.fillStyle='#3b3935';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${Math.floor(cell*(n===1?.7:.42))}px ${FONT}`;
  ctx.fillText(it.zh,(it.x+.5)*cell,(it.y+.54)*cell);
  if(power)ctx.restore();
  ctx.globalAlpha=1;
}
function drawPlayer(){
  const p=pos(P),cx=(p.x+.5)*cell,cy=(p.y+.5)*cell,r=cell*.42;
  if(G.invincible>0&&Math.sin(G.time*18)>0)ctx.globalAlpha=.35;
  const open=(Math.sin(G.time*14)+1)/2*.55+.05;
  ctx.fillStyle='#3b3935';ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.arc(cx,cy,r,P.face+open,P.face+Math.PI*2-open);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
}
function drawMonster(m){
  const p=pos(m),cx=(p.x+.5)*cell,cy=(p.y+.5)*cell,r=cell*.42;
  const fr=G.fright>0;
  let col=m.color;
  if(fr)col=(G.fright<2&&Math.sin(G.time*14)>0)?'#f5f2ea':'#aab8cc';
  if(m.wait>0)ctx.globalAlpha=.6;
  ctx.fillStyle=col;ctx.strokeStyle='#3b3935';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy-r*.1,r,Math.PI,0);
  ctx.lineTo(cx+r,cy+r*.9);
  const n=4;
  for(let i=0;i<=n;i++){
    const x=cx+r-(2*r*i/n),y=(i%2===0)?cy+r*.9:cy+r*.55;
    ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();if(fr)ctx.stroke();
  if(fr){
    ctx.fillStyle='#3b3935';
    ctx.beginPath();ctx.arc(cx-r*.35,cy-r*.15,r*.12,0,7);ctx.arc(cx+r*.35,cy-r*.15,r*.12,0,7);ctx.fill();
  }else{
    for(const s of[-1,1]){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+s*r*.38,cy-r*.15,r*.27,0,7);ctx.fill();
      ctx.fillStyle='#3b3935';ctx.beginPath();ctx.arc(cx+s*r*.38+m.dx*r*.1,cy-r*.15+m.dy*r*.1,r*.13,0,7);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,COLS*cell,ROWS*cell);
  drawMaze();
  if(!G)return;
  G.items.forEach(drawItem);
  G.monsters.forEach(drawMonster);
  drawPlayer();
  ctx.textAlign='center';ctx.textBaseline='middle';
  G.pops.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.t);ctx.fillStyle=p.color;
    ctx.font=`600 ${Math.floor(cell*.6)}px ${FONT}`;ctx.fillText(p.text,p.x,p.y);
  });
  ctx.globalAlpha=1;
  if(G.flash>0){ctx.fillStyle=`rgba(181,96,90,${Math.min(.28,G.flash)})`;ctx.fillRect(0,0,COLS*cell,ROWS*cell);}
  if(G.bannerT>0){
    ctx.fillStyle='rgba(59,57,53,.86)';
    const bh=cell*1.6,by=cell*ROWS*.42;
    ctx.fillRect(0,by,COLS*cell,bh);
    ctx.fillStyle='#faf8f3';ctx.font=`600 ${Math.floor(cell*.9)}px ${FONT}`;
    ctx.fillText(G.banner,COLS*cell/2,by+bh/2);
  }
}

/* ---------- 選單與結算 ---------- */
function showMenu(){
  state='menu';
  const o=$('ov');o.classList.add('show');
  o.innerHTML=`<div class="card">
    <h1>吃字小精靈</h1><h2>Come Caracteres</h2>
    <div class="lab">Modo</div>
    <div class="row">
      <button class="opt ${cfg.mode==='text'?'on':''}" data-mode="text">Español → 中文</button>
      <button class="opt ${cfg.mode==='listen'?'on':''}" data-mode="listen">Escuchar 🔊</button>
    </div>
    <div class="lab">Nivel</div>
    <div class="row">
      <button class="opt ${cfg.level===1?'on':''}" data-level="1">Inicial<br><small>1 carácter</small></button>
      <button class="opt ${cfg.level===2?'on':''}" data-level="2">Medio<br><small>2 caracteres</small></button>
      <button class="opt ${cfg.level===3?'on':''}" data-level="3">Avanzado<br><small>2 caracteres</small></button>
    </div>
    <label class="chk"><input type="checkbox" id="pyc" ${cfg.pinyin?'checked':''}> Mostrar pinyin como pista</label>
    <button class="main" id="go">Jugar</button>
    <p>Desliza (o usa las flechas) para moverte.<br>Come el carácter correcto. Un error = −50 puntos.<br>Si un monstruo te toca pierdes una vida ♥.<br>Come 力 para poder comer monstruos.</p>
    <p>Mejor puntuación: <b style="color:var(--ink)">${best}</b></p>
  </div>`;
  o.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;lsSet('cc_cfg',cfg);showMenu();});
  o.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{cfg.level=+b.dataset.level;lsSet('cc_cfg',cfg);showMenu();});
  $('pyc').onchange=e=>{cfg.pinyin=e.target.checked;lsSet('cc_cfg',cfg);};
  $('go').onclick=()=>{
    speechSynthesis&&speechSynthesis.getVoices&&speechSynthesis.getVoices();
    startGame();
  };
}
function showOver(){
  const o=$('ov');o.classList.add('show');
  const miss=G.mistakes.length
    ?`<div class="lab">Para repasar</div><div class="miss">${G.mistakes.map(m=>`<div><span class="zh">${esc(m.zh)}</span><span class="py">${esc(m.py)}</span>${esc(m.es)}</div>`).join('')}</div>`
    :`<p>¡Sin errores de caracteres! 👏</p>`;
  o.innerHTML=`<div class="card">
    <h2>Fin del juego</h2>
    <div class="big">${G.score}</div>
    <p>Mejor puntuación: ${best}${G.score>=best&&G.score>0?' · ¡Nuevo récord!':''}</p>
    ${miss}
    <button class="main" id="again">Jugar de nuevo</button>
    <button class="sub" id="menu">Menú</button>
  </div>`;
  $('again').onclick=startGame;
  $('menu').onclick=showMenu;
}
function showPause(){
  state='pause';
  const o=$('ov');o.classList.add('show');
  o.innerHTML=`<div class="card"><h1>Pausa</h1><button class="main" id="resume">Continuar</button><button class="sub" id="menu">Menú</button></div>`;
  $('resume').onclick=()=>{state='play';o.classList.remove('show');};
  $('menu').onclick=showMenu;
}

/* ---------- 操作：鍵盤與滑動 ---------- */
const KEYS={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};
window.addEventListener('keydown',e=>{
  const d=KEYS[e.key];
  if(d){e.preventDefault();setWant(d[0],d[1]);}
  else if(e.key==='p'&&state==='play')showPause();
});
let tx0=0,ty0=0,touching=false;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('#ov')||e.target.closest('button'))return;
  const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;touching=true;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!touching)return;
  if(e.target.closest('.miss'))return;
  e.preventDefault();
  const t=e.touches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;
  if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;
  if(Math.abs(dx)>Math.abs(dy))setWant(dx>0?1:-1,0);else setWant(0,dy>0?1:-1);
  tx0=t.clientX;ty0=t.clientY;
},{passive:false});
document.addEventListener('touchend',()=>{touching=false;});
$('speak').onclick=()=>{if(G&&G.q)speak(G.q.zh);};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')showPause();});

/* ---------- 主迴圈 ---------- */
let last=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(state==='play')update(dt);
  draw();
  requestAnimationFrame(frame);
}
resize();showMenu();requestAnimationFrame(frame);
</script>
