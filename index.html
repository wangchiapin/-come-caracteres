/* ---------- 地圖 15 x 19（# 牆；第 9 列兩側是穿越隧道；每場、每升一級都重新隨機產生） ---------- */
const COLS=15,ROWS=19,TUNNEL=9;
const PLAYER_START=[7,13];
const HOMES=[[7,9],[6,9],[8,9],[7,7]];
let grid=[],SPAWN=[];
function isWall(x,y){
  if(y===TUNNEL&&(x<0||x>=COLS))return false;
  if(x<0||x>=COLS||y<0||y>=ROWS)return true;
  return grid[y][x]==='#';
}
const wrapX=x=>(x+COLS)%COLS;
function buildMaze(){
  grid=genMaze().map(r=>r.split(''));
  SPAWN=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]==='#')continue;
    if(x>=4&&x<=10&&y>=6&&y<=12)continue;
    if(y===TUNNEL&&(x===0||x===COLS-1))continue;
    if(x===PLAYER_START[0]&&y===PLAYER_START[1])continue;
    SPAWN.push([x,y]);
  }
}
/* ---------- 隨機迷宮：左右對稱、沒有死路、中間有怪物小屋、第 9 列兩側是隧道 ---------- */
function genMaze(){
  // 節點在 x=1,4,7,10,13、y=1,3,…,17；牆壁方塊寬 2 高 1。只產生左半邊再鏡射，所以左右對稱。
  const NI=5,NJ=9,HI=2,HJ=4;                       // HI,HJ：小屋所在節點（中間）
  const key=(i,j,t)=>i+','+j+t;                    // t='h' 往右連、't'='v' 往下連
  const E=new Set();
  const mir=(i,j,t)=>t==='h'?[3-i,j,'h']:[4-i,j,'v']; // 水平邊 (i→i+1) 的鏡像是 (3-i→4-i)；垂直邊 i→4-i
  function has(i,j,t){return E.has(key(i,j,t));}
  function add(i,j,t){E.add(key(i,j,t));const m=mir(i,j,t);E.add(key(m[0],m[1],m[2]));}
  const isHouse=(i,j)=>i===HI&&j===HJ;
  const ok=(i,j)=>i>=0&&i<NI&&j>=0&&j<NJ&&!isHouse(i,j);
  // 某節點的所有可連的邊（上下左右）
  function nbrs(i,j){
    const r=[];
    if(ok(i+1,j))r.push([i+1,j,i,j,'h']);
    if(ok(i-1,j))r.push([i-1,j,i-1,j,'h']);
    if(ok(i,j+1))r.push([i,j+1,i,j,'v']);
    if(ok(i,j-1))r.push([i,j-1,i,j-1,'v']);
    return r;                                      // [鄰居i,鄰居j,邊的i,邊的j,邊類型]
  }
  // 隨機深度優先，只在左半（i<=2）走
  const seen=new Set([HI+','+HJ]);
  const st=[[0,rnd(NJ)===HJ?0:rnd(NJ)]];
  seen.add(st[0][0]+','+st[0][1]);
  while(st.length){
    const [ci,cj]=st[st.length-1];
    const c=shuffle(nbrs(ci,cj).filter(n=>n[0]<=HI&&!seen.has(n[0]+','+n[1])));
    if(!c.length){st.pop();continue;}
    const n=c[0];seen.add(n[0]+','+n[1]);add(n[2],n[3],n[4]);st.push([n[0],n[1]]);
  }
  // 沒有死路：每個節點至少連 2 條（隧道旁的兩個節點算多 1 條）
  const deg=(i,j)=>nbrs(i,j).filter(n=>has(n[2],n[3],n[4])).length+((j===4&&(i===0||i===4))?1:0)+((i===HI&&j===HJ-1)?1:0);
  for(let pass=0;pass<30;pass++){
    let changed=false;
    for(let j=0;j<NJ;j++)for(let i=0;i<=HI;i++){
      if(isHouse(i,j))continue;
      if(deg(i,j)>=2)continue;
      const c=shuffle(nbrs(i,j).filter(n=>!has(n[2],n[3],n[4])));
      if(c.length){add(c[0][2],c[0][3],c[0][4]);changed=true;}
    }
    if(!changed)break;
  }
  // 多開幾條路，變成會繞圈的迷宮
  for(let j=0;j<NJ;j++)for(let i=0;i<=HI;i++){
    if(isHouse(i,j))continue;
    for(const n of nbrs(i,j)){
      if(n[0]>HI&&n[4]==='h')continue;
      if(!has(n[2],n[3],n[4])&&Math.random()<.10)add(n[2],n[3],n[4]);
    }
  }
  // 小屋與門：(7,7)↔小屋 永遠開著
  // 畫成格子
  const g=[];for(let y=0;y<ROWS;y++)g.push(new Array(COLS).fill('#'));
  const X=i=>1+3*i,Y=j=>1+2*j;
  for(let j=0;j<NJ;j++)for(let i=0;i<NI;i++){
    if(isHouse(i,j))continue;
    g[Y(j)][X(i)]='.';
    if(has(i,j,'h')){g[Y(j)][X(i)+1]='.';g[Y(j)][X(i)+2]='.';}
    if(has(i,j,'v')){g[Y(j)+1][X(i)]='.';}
  }
  // 小屋：第 9 列 x=6..8，門在 (7,8)
  g[9][6]=g[9][7]=g[9][8]='.';g[8][7]='.';g[9][7]='.';
  // 隧道
  g[9][0]='.';g[9][COLS-1]='.';
  return g.map(r=>r.join(''));
}

const SETTINGS_KEY = 'hanziGames.settings';
const SET_OPTS = { script:['trad','simp'], lang:['es','en','zh'], phon:['pinyin','zhuyin','both','off'], rate:['slow','normal','fast'] };
const RATE_VALUE = { slow:0.45, normal:0.65, fast:0.85 };
function writeSettings(o){
  try{
    let cur = {};
    try{ cur = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; }catch(e){}
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign(cur, { v:1, script:o.script, lang:o.lang, phon:o.phon, rate:o.rate })));
  }catch(e){}
}
function readSettings(){
  const out = { v:1, script:'trad', lang:'es', phon:'pinyin', rate:'normal' };
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); }catch(e){}
  if (saved && typeof saved === 'object'){
    Object.keys(SET_OPTS).forEach(k => { if (SET_OPTS[k].includes(saved[k])) out[k] = saved[k]; });
  } else writeSettings(out);
  return out;
}
const S = readSettings();

/* ---------- 聲音 ---------- */
let ac;
function beep(f,d,type,v,slide){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  ok(){beep(660,.12,'sine',.06);setTimeout(()=>beep(880,.15,'sine',.06),90);},
  bad(){beep(200,.22,'sawtooth',.04,140);},
  hit(){beep(320,.45,'square',.04,70);},
  power(){beep(520,.3,'triangle',.06,1040);},
  eatM(){beep(400,.2,'square',.04,900);}
};
function speak(t){
  if(!('speechSynthesis' in window))return;                              // 找不到中文聲音的提示由 voicehint 負責
  try{
    const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=RATE_VALUE[S.rate]||.65;
    const vs=speechSynthesis.getVoices();
    const ok=v=>{const l=String(v.lang||'').toLowerCase().replace(/_/g,'-');return !(l.indexOf('yue')===0||l.indexOf('zh-hk')===0);};
    const v=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^(zh|cmn)/i.test(v.lang)&&ok(v));
    if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 實體移動（格子到格子，平滑） ---------- */
function makeEnt(x,y,speed){return {tx:x,ty:y,nx:x,ny:y,prog:0,dx:0,dy:0,speed};}
function resetEnt(e,x,y){e.tx=x;e.ty=y;e.nx=x;e.ny=y;e.prog=0;e.dx=0;e.dy=0;}
function setDir(e,dx,dy){e.dx=dx;e.dy=dy;e.nx=e.tx+dx;e.ny=e.ty+dy;}
function pos(e){return {x:e.tx+(e.nx-e.tx)*e.prog,y:e.ty+(e.ny-e.ty)*e.prog};}
function stepEnt(e,dt,pick){
  let move=e.speed*dt,guard=0;
  while(move>0&&guard++<8){
    if(e.dx===0&&e.dy===0){
      pick(e);
      if(e.dx===0&&e.dy===0)return;
      e.prog=0;
    }
    const need=1-e.prog;
    if(move>=need){
      move-=need;
      e.tx=wrapX(e.nx);e.ty=e.ny;e.prog=0;
      pick(e);
      if(e.dx===0&&e.dy===0){e.nx=e.tx;e.ny=e.ty;return;}
    }else{e.prog+=move;move=0;}
  }
}
function pickPlayer(e){
  const w=P.want;
  if(w&&!isWall(e.tx+w[0],e.ty+w[1])){setDir(e,w[0],w[1]);return;}
  if((e.dx||e.dy)&&!isWall(e.tx+e.dx,e.ty+e.dy)){setDir(e,e.dx,e.dy);return;}
  e.dx=0;e.dy=0;
}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function pickMonster(m){
  let opts=DIRS.filter(d=>!isWall(m.tx+d[0],m.ty+d[1]));
  const fwd=opts.filter(d=>!((m.dx||m.dy)&&d[0]===-m.dx&&d[1]===-m.dy));
  if(fwd.length)opts=fwd;
  if(!opts.length){m.dx=0;m.dy=0;return;}
  const d=opts[rnd(opts.length)];
  setDir(m,d[0],d[1]);
}
function setWant(dx,dy){
  if(state!=='play'||!P)return;
  P.want=[dx,dy];
  // 移動中直接回頭
  if((P.dx||P.dy)&&dx===-P.dx&&dy===-P.dy){
    const ntx=P.nx,nty=P.ny;
    if(ntx<0||ntx>=COLS)return;
    P.nx=P.tx;P.ny=P.ty;P.tx=ntx;P.ty=nty;P.prog=1-P.prog;P.dx=-P.dx;P.dy=-P.dy;
  }
}

let state='menu',G=null,P=null;
const MCOLORS=['#b5705a','#6f6a62','#b89968','#6f8a8c']; // 機車、蚊子、野狗、颱風
function monstersForStage(s){return s>=5?4:s>=3?3:2;}
function monsterBase(){return Math.min(4.6,3.1+.25*(G.stage-1));}

function addMonster(i,wait){
  const h=HOMES[i%HOMES.length];
  const m=makeEnt(h[0],h[1],3.1);
  m.type=i%4;m.color=MCOLORS[i%4];m.fx=1;m.home=h;m.wait=wait;
  G.monsters.push(m);
}
function startGame(){
  buildMaze();
  try{HGPlays.start('L'+cfg.level);}catch(e){}
  G={score:0,lives:3,stage:1,correct:0,combo:0,items:[],monsters:[],pops:[],mistakes:[],
     q:null,lastZh:'',invincible:0,fright:0,freeze:1.4,banner:T('ready'),bannerT:1.4,time:0,flash:0,chomp:0};
  P=makeEnt(PLAYER_START[0],PLAYER_START[1],5.2);P.want=null;P.face=Math.PI;
  const n=monstersForStage(1);
  for(let i=0;i<n;i++)addMonster(i,1.5+i*3);
  state='play';
  $('ov').classList.remove('show');
  updateHud();newQuestion();
}

function freeCell(minDist){
  const occ=new Set(G.items.map(i=>i.x+','+i.y));
  const pp=pos(P);
  const c=SPAWN.filter(([x,y])=>!occ.has(x+','+y)&&Math.abs(x-pp.x)+Math.abs(y-pp.y)>=minDist);
  return c.length?c[rnd(c.length)]:SPAWN[rnd(SPAWN.length)];
}
function pickDistractor(q){
  const pool=BANK.filter(w=>w.l===cfg.level&&w.zh!==q.zh&&![...w.zh].some(ch=>q.zh.includes(ch)));
  const used=new Set(G.items.map(i=>i.zh));
  const c=pool.filter(w=>!used.has(w.zh));
  return (c.length?c:pool)[rnd((c.length?c:pool).length)];
}
function addItem(w,kind){
  const [x,y]=freeCell(5);
  G.items.push({x,y,w,zh:w.zh,kind,t:kind==='power'?14:0,seed:Math.random()*6});
}
function newQuestion(){
  const pool=BANK.filter(w=>w.l===cfg.level);
  let w;do{w=pool[rnd(pool.length)];}while(w.zh===G.lastZh&&pool.length>1);
  G.lastZh=w.zh;G.q=w;G.q.missed=false;
  G.items=G.items.filter(i=>i.kind==='power');
  addItem(w,'ok');
  for(let i=0;i<3;i++)addItem(pickDistractor(w),'bad');
  renderPrompt();
  if(effMode()==='listen')speak(w.zh);
}
function renderPrompt(){
  const q=G.q,r=reading(q),py=r?`<span class="py">${esc(r)}</span>`:'';
  $('speak').classList.toggle('hide',effMode()!=='listen');
  if(effMode()==='listen'){
    $('ptext').innerHTML=`<span class="es">${esc(T('listenQ'))}</span>`+py;
  }else{
    $('ptext').innerHTML=`${esc(T('eat'))} <span class="es">${esc(gloss(q))}</span>`+py;
  }
}
let fbTimer=0;
function setFb(t,cls){
  const f=$('fb');f.textContent=t;f.className=cls||'';
  clearTimeout(fbTimer);fbTimer=setTimeout(()=>{f.textContent='';},2200);
}
function updateHud(){
  $('score').textContent=G.score;
  $('stagev').textContent=G.stage;
  $('lives').textContent='♥'.repeat(G.lives)+'♡'.repeat(Math.max(0,3-G.lives));
}
function pop(x,y,text,color){G.pops.push({x:(x+.5)*cell,y:(y+.5)*cell,text,color,t:1});}

/* ---------- 吃字與碰撞 ---------- */
function eatItem(it){
  const pp=pos(P);
  G.items.splice(G.items.indexOf(it),1);
  if(it.kind==='ok'){
    G.combo++;
    const pts=100+Math.min(G.combo-1,9)*10;
    G.score+=pts;G.correct++;G.chomp=.3;
    pop(it.x,it.y,'+'+pts,'#6b8e6b');sfx.ok();
    setFb(`✓ ${disp(G.q)}  ${reading(G.q)}${gloss(G.q)?'  =  '+gloss(G.q):''}`,'ok');
    if(G.correct%3===0&&!G.items.some(i=>i.kind==='power'))addItem(POWER,'power');
    if(G.correct%8===0){
      G.stage++;G.banner=T('stageBanner',{n:G.stage});G.bannerT=1.6;
      if(G.monsters.length<monstersForStage(G.stage))addMonster(G.monsters.length,2);
      buildMaze();resetPositions();G.items=[];G.freeze=1.3;G.invincible=1.6;
    }
    updateHud();newQuestion();
  }else if(it.kind==='bad'){
    G.combo=0;G.score=Math.max(0,G.score-50);G.flash=.35;
    pop(it.x,it.y,'-50','#b5605a');sfx.bad();
    setFb(`✗ ${disp(it.w)}  ${reading(it.w)}`,'bad');
    if(!G.q.missed){
      G.q.missed=true;
      if(!G.mistakes.some(m=>m.zh===G.q.zh))G.mistakes.push(G.q);
    }
    addItem(pickDistractor(G.q),'bad');
    updateHud();
  }else{
    G.fright=8;G.score+=50;pop(it.x,it.y,'+50','#b08d3c');sfx.power();updateHud();
  }
}
function eatMonster(m){
  G.score+=200;pop(pos(m).x,pos(m).y,'+200','#b08d3c');sfx.eatM();
  resetEnt(m,m.home[0],m.home[1]);m.wait=3;updateHud();
}
function resetPositions(){
  resetEnt(P,PLAYER_START[0],PLAYER_START[1]);P.want=null;P.face=Math.PI;
  G.monsters.forEach((m,i)=>{resetEnt(m,m.home[0],m.home[1]);m.wait=1.5+i*2;});
  G.fright=0;
}
function hitPlayer(){
  G.lives--;G.combo=0;G.flash=.5;sfx.hit();updateHud();
  if(G.lives<=0){gameOver();return;}
  resetPositions();G.invincible=2.6;G.freeze=.9;
}
function gameOver(){
  state='over';
  try{HGPlays.end({score:G.score});}catch(e){}
  saveScore(G.score);
  showOver();
}
function saveScore(s){
  if(s>best){best=s;lsSet('cc_best',best);}
  // TODO（之後接 Firebase 排行榜）：在這裡把 s 寫進 leaderboard collection
}

/* ---------- 更新 ---------- */
function update(dt){
  G.time+=dt;
  if(G.bannerT>0)G.bannerT-=dt;
  if(G.flash>0)G.flash-=dt;
  if(G.chomp>0)G.chomp-=dt;
  G.pops.forEach(p=>{p.t-=dt*1.1;p.y-=dt*24;});
  G.pops=G.pops.filter(p=>p.t>0);
  if(G.freeze>0){G.freeze-=dt;return;}
  if(G.invincible>0)G.invincible-=dt;
  if(G.fright>0)G.fright=Math.max(0,G.fright-dt);

  stepEnt(P,dt,pickPlayer);
  if(P.dx||P.dy)P.face=Math.atan2(P.dy,P.dx);
  const spd=monsterBase()*(G.fright>0?.6:1);
  for(const m of G.monsters){
    if(m.wait>0){m.wait-=dt;continue;}
    m.speed=spd;stepEnt(m,dt,pickMonster);
  }
  for(const it of G.items.slice()){
    if(it.kind==='power'){it.t-=dt;if(it.t<=0){G.items.splice(G.items.indexOf(it),1);continue;}}
  }
  const pp=pos(P);
  for(const it of G.items.slice()){
    if(Math.hypot(pp.x-it.x,pp.y-it.y)<.55){eatItem(it);if(state!=='play')return;}
  }
  for(const m of G.monsters){
    if(m.wait>0)continue;
    const mp=pos(m);
    if(Math.hypot(pp.x-mp.x,pp.y-mp.y)<.62){
      if(G.fright>0)eatMonster(m);
      else if(G.invincible<=0){hitPlayer();break;}
    }
  }
}

/* ---------- 繪圖 ---------- */
let cell=24,dpr=1;
function resize(){
  const st=$('stage');
  const w=st.clientWidth,h=st.clientHeight;
  cell=Math.max(12,Math.floor(Math.min(w/COLS,h/ROWS)));
  dpr=window.devicePixelRatio||1;
  cv.style.width=cell*COLS+'px';cv.style.height=cell*ROWS+'px';
  cv.width=cell*COLS*dpr;cv.height=cell*ROWS*dpr;
}
window.addEventListener('resize',resize);
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

function drawMaze(){
  ctx.fillStyle='#faf8f3';ctx.fillRect(0,0,COLS*cell,ROWS*cell);
  ctx.fillStyle='#e6e1d4';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x]==='#')ctx.fillRect(x*cell,y*cell,cell,cell);
  ctx.strokeStyle='#a39b8a';ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]!=='#')continue;
    const X=x*cell,Y=y*cell;
    const open=(a,b)=>a>=0&&a<COLS&&b>=0&&b<ROWS&&grid[b][a]!=='#';
    if(open(x,y-1)){ctx.moveTo(X,Y);ctx.lineTo(X+cell,Y);}
    if(open(x,y+1)){ctx.moveTo(X,Y+cell);ctx.lineTo(X+cell,Y+cell);}
    if(open(x-1,y)){ctx.moveTo(X,Y);ctx.lineTo(X,Y+cell);}
    if(open(x+1,y)){ctx.moveTo(X+cell,Y);ctx.lineTo(X+cell,Y+cell);}
  }
  ctx.stroke();
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawItem(it){
  const s=cell*.92,x=it.x*cell+(cell-s)/2,y=it.y*cell+(cell-s)/2;
  const power=it.kind==='power';
  let alpha=1;
  if(power&&it.t<3)alpha=Math.sin(G.time*14)>0?1:.35;
  ctx.globalAlpha=alpha;
  if(power){
    const k=1+Math.sin(G.time*5+it.seed)*.06;
    ctx.save();ctx.translate((it.x+.5)*cell,(it.y+.5)*cell);ctx.scale(k,k);ctx.translate(-(it.x+.5)*cell,-(it.y+.5)*cell);
  }
  rr(x,y,s,s,s*.22);
  ctx.fillStyle=power?'#efe3c2':'#ffffff';ctx.fill();
  ctx.strokeStyle=power?'#b08d3c':'#8a8478';ctx.lineWidth=power?2:1.2;ctx.stroke();
  const txt=disp(it.w),n=[...txt].length;
  ctx.fillStyle='#3b3935';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${Math.floor(cell*(n===1?.7:.42))}px ${FONT}`;
  ctx.fillText(txt,(it.x+.5)*cell,(it.y+.54)*cell);
  if(power)ctx.restore();
  ctx.globalAlpha=1;
}

const SVG_H='<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 100 100">';

function pol(cx,cy,r,deg){const a=deg*Math.PI/180;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];}
function f1(n){return Math.round(n*10)/10;}

// 小籠包：側面、正面、背面（腳與嘴巴各有兩個畫面）
const BUN_BODY='M7 66 Q7 87 50 88 Q93 87 93 66 Q93 48 66 40 Q58 36 56 30 L44 30 Q42 36 34 40 Q7 48 7 66 Z';
function bunWrap(inner){
  return SVG_H+`<g stroke="${INK}" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">
  <defs><radialGradient id="s" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#fffbf1"/><stop offset=".6" stop-color="#f4e8cc"/><stop offset="1" stop-color="#e0cc9c"/></radialGradient></defs>
  <ellipse cx="50" cy="93" rx="38" ry="3.4" fill="#000" opacity=".08" stroke="none"/>${inner}</g></svg>`;

function bunCommon(feet){
  let pl='';
  for(let k=-4;k<=4;k++){
    const sx=50+k*2.4,ex=50+k*9.6,ey=45+Math.abs(k)*3.3,cx=50+k*5.5;
    pl+=`<path d="M${sx} 31 Q${cx} 38 ${ex} ${ey}"/>`;

const SPR={};
function bake(name,svg){
  const im=new Image();
  im.onload=()=>{
    const mk=fill=>{
      const c=document.createElement('canvas');c.width=c.height=192;
      const x=c.getContext('2d');x.drawImage(im,0,0,192,192);
      if(fill){x.globalCompositeOperation='source-atop';x.fillStyle=fill;x.fillRect(0,0,192,192);}
      return c;
    };
    SPR[name]={n:mk(),f:mk('rgba(150,172,206,.66)'),b:mk('rgba(250,248,243,.88)')};
  };
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
bake('sideO',svgBunSide(true));bake('sideC',svgBunSide(false));bake('frontO',svgBunFront(true));bake('frontC',svgBunFront(false));
bake('backA',svgBunBack(true));bake('backB',svgBunBack(false));
bake('scooter',svgScooter());
bake('mosA',svgMosquito(true));bake('mosB',svgMosquito(false));
bake('dogA',svgDog(true));bake('dogB',svgDog(false));
bake('arms',svgTyphoonArms());bake('face',svgTyphoonFace());

function drawPlayer(){
  // 主角：小籠包。左右畫側面（朝左時翻轉）、往下畫正面、往上畫背面
  const p=pos(P),cx=(p.x+.5)*cell,cy=(p.y+.5)*cell;
  const moving=!!(P.dx||P.dy);
  const f=P.face;
  const chomp=G.chomp>0;
  const cyc=Math.sin(G.time*14)>0;
  const open=chomp||(moving&&cyc);
  let name,flip=1;
  if(Math.abs(Math.sin(f))>.5){
    name=Math.sin(f)>0?(open?'frontO':'frontC'):(moving&&cyc?'backA':'backB');
  }else{
    name=open?'sideO':'sideC';
    flip=Math.cos(f)<0?-1:1;
  }
  const sp=SPR[name];
  if(!sp)return;
  let S=cell*1.15,sx=1,sy=1;
  if(chomp){const t=Math.sin(Math.min(1,G.chomp/.3)*Math.PI);sx=1+.1*t;sy=1-.08*t;}   // 吃到字時彈一下
  if(G.invincible>0&&Math.sin(G.time*18)>0)ctx.globalAlpha=.35;
  ctx.save();ctx.translate(cx,cy+S*.32);ctx.scale(flip*sx,sy);
  ctx.drawImage(sp.n,-S/2,-S*.92,S,S);
  ctx.restore();ctx.globalAlpha=1;
}
function drawMonster(m){
  const p=pos(m),cx=(p.x+.5)*cell,cy=(p.y+.5)*cell,r=cell*.44;
  if(m.dx)m.fx=m.dx>0?1:-1;
  if(!m.fx)m.fx=1;
  const fr=G.fright>0,blink=fr&&G.fright<2&&Math.sin(G.time*14)>0;
  const k=fr?(blink?'b':'f'):'n';
  const S=cell*1.2;
  if(m.wait>0)ctx.globalAlpha=.6;
  ctx.save();ctx.translate(cx,cy);
  if(fr){ctx.scale(.84,.84);ctx.translate(Math.sin(G.time*32)*r*.06,r*.08);}      // 縮頭縮腦、發抖
  if(m.type===3){
    const a=SPR.arms,fc=SPR.face;
    if(a){ctx.save();ctx.rotate(G.time*(fr?1.5:3.2));ctx.drawImage(a[k],-S/2,-S/2,S,S);ctx.restore();}
    if(fc)ctx.drawImage(fc[k],-S/2,-S/2,S,S);
  }else{
    const name=m.type===0?'scooter':m.type===1?(Math.floor(G.time*22)%2?'mosA':'mosB'):(Math.floor(G.time*9)%2?'dogA':'dogB');
    const sp=SPR[name];
    if(sp){ctx.save();ctx.scale(m.fx,1);ctx.drawImage(sp[k],-S/2,-S/2,S,S);ctx.restore();}
  }
  if(fr){                                                                           // 冷汗
    ctx.fillStyle='#8fb4d9';ctx.strokeStyle=INK;ctx.lineWidth=Math.max(1,cell*.03);
    ctx.beginPath();ctx.moveTo(.72*r,-.9*r);ctx.quadraticCurveTo(.98*r,-.5*r,.72*r,-.42*r);ctx.quadraticCurveTo(.46*r,-.5*r,.72*r,-.9*r);ctx.fill();ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,COLS*cell,ROWS*cell);
  drawMaze();
  if(!G)return;
  G.items.forEach(drawItem);
  G.monsters.forEach(drawMonster);
  drawPlayer();
  ctx.textAlign='center';ctx.textBaseline='middle';
  G.pops.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.t);ctx.fillStyle=p.color;
    ctx.font=`600 ${Math.floor(cell*.6)}px ${FONT}`;ctx.fillText(p.text,p.x,p.y);
  });
  ctx.globalAlpha=1;
  if(G.flash>0){ctx.fillStyle=`rgba(181,96,90,${Math.min(.28,G.flash)})`;ctx.fillRect(0,0,COLS*cell,ROWS*cell);}
  if(G.bannerT>0){
    ctx.fillStyle='rgba(59,57,53,.86)';
    const bh=cell*1.6,by=cell*ROWS*.42;
    ctx.fillRect(0,by,COLS*cell,bh);
    ctx.fillStyle='#faf8f3';ctx.font=`600 ${Math.floor(cell*.9)}px ${FONT}`;
    ctx.fillText(G.banner,COLS*cell/2,by+bh/2);
  }
}

/* ---------- 操作：鍵盤與滑動 ---------- */
const KEYS={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};
window.addEventListener('keydown',e=>{
  const d=KEYS[e.key];
  if(d){e.preventDefault();setWant(d[0],d[1]);}
  else if(e.key==='p'&&state==='play')showPause();
});
let tx0=0,ty0=0,touching=false;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('#ov')||e.target.closest('button'))return;
  const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;touching=true;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!touching)return;
  if(e.target.closest('.miss'))return;
  e.preventDefault();
  const t=e.touches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;
  if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;
  if(Math.abs(dx)>Math.abs(dy))setWant(dx>0?1:-1,0);else setWant(0,dy>0?1:-1);
  tx0=t.clientX;ty0=t.clientY;
},{passive:false});
document.addEventListener('touchend',()=>{touching=false;});
$('speak').onclick=()=>{if(G&&G.q)speak(G.q.zh);};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')showPause();});

let last=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(state==='play')update(dt);
  draw();
  requestAnimationFrame(frame);
}
applyLang();resize();showMenu();requestAnimationFrame(frame);

  var T={

           es:'No se encontró una voz de chino (Taiwán) en este dispositivo, así que no se oirá el audio. Instala la voz «chino (Taiwán)» en los ajustes del móvil o usa otro dispositivo.',
           en:'No Chinese (Taiwan) voice was found on this device, so you won’t hear the audio. Install the “Chinese (Taiwan)” voice in your phone settings, or use another device.' },
    nosynth:{ zh:['這個瀏覽器不支援語音，聽不到念的內容。請換一個瀏覽器（例如 Chrome、Safari）。','这个浏览器不支持语音，听不到念的内容。请换一个浏览器（例如 Chrome、Safari）。'],
           es:'Este navegador no admite voz, así que no se oirá el audio. Usa otro navegador (por ejemplo Chrome o Safari).',
           en:'This browser does not support speech, so you won’t hear the audio. Try another browser (for example Chrome or Safari).' }
  };
  function show(kind){
    if(shown||document.getElementById('hgVoiceHint')) return; shown=true;
    var s=cfg(), lang=s.lang||'es', simp=s.script==='simp', t=T[kind];
    var st=document.createElement('style');
    st.textContent='#hgVoiceHint{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147482999;width:min(94vw,520px);box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fff6dc;border:1px solid #d8b24a;color:#5b4410;font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}#hgVoiceHint .m{flex:1}#hgVoiceHint .m small{display:block;font-size:11px;opacity:.85;margin-top:2px}#hgVoiceHint button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='hgVoiceHint'; d.setAttribute('role','status');
    var m=document.createElement('div'); m.className='m';
    var zh=document.createElement('div'); zh.textContent = simp ? t.zh[1] : t.zh[0]; m.appendChild(zh);
    if(lang!=='zh'){ var sm=document.createElement('small'); sm.textContent = lang==='en' ? t.en : t.es; m.appendChild(sm); }
    var x=document.createElement('button'); x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','Close');
    x.addEventListener('click',function(){ d.remove(); });
    d.appendChild(m); d.appendChild(x); document.body.appendChild(d);
  }
  function check(){
    try{
      if(!window.speechSynthesis){ show('nosynth'); return; }
      var vs=window.speechSynthesis.getVoices()||[];
      if(vs.length && !vs.some(isMandarin)) show('none');   // 清單是空的時（有些手機一開始就是空的）先不判斷
    }catch(e){}
  }
  function start(){
    check();
    try{ window.speechSynthesis.addEventListener('voiceschanged', check); }catch(e){}
    setTimeout(check,1500); setTimeout(check,4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
/* ===== /找不到中文聲音的提示 ===== */
</script>
<script>
/* ===== 一鍵靜音（只關音樂和音效，不影響念字的語音）— 每天一分鐘遊戲統一做法 ===== */
(function(){
  var KEY='hg.mute.come_caracteres', MOUNT='', muted=false, masters=[];
  try{ muted = localStorage.getItem(KEY)==='1'; }catch(e){}
  /* 讓這個遊戲建立的所有 Web Audio 聲音，都先經過一個總音量；靜音＝總音量 0 */
  try{
    var BP = window.BaseAudioContext ? window.BaseAudioContext.prototype : (window.AudioContext||window.webkitAudioContext).prototype;
    var desc = Object.getOwnPropertyDescriptor(BP,'destination');
    if(desc && desc.get){
      Object.defineProperty(BP,'destination',{configurable:true,get:function(){
        var real = desc.get.call(this);
        if(!this.__hgMaster){
          try{ var g=this.createGain(); g.gain.value = muted?0:1; g.connect(real); this.__hgMaster=g; masters.push(g); }
          catch(e){ return real; }
        }
        return this.__hgMaster;
      }});
    }
  }catch(e){}
  /* 備用的 <audio> 播放（例如 iPhone 的 Chrome）也一起靜音 */
  try{
    var op = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function(){ this.muted = muted; return op.apply(this, arguments); };
  }catch(e){}
  function apply(){ masters.forEach(function(g){ try{ g.gain.setValueAtTime(muted?0:1, g.context.currentTime); }catch(e){ g.gain.value = muted?0:1; } }); }
  function build(){
    if(document.getElementById('hgMute')) return;
    var st=document.createElement('style');
    st.textContent='#hgMute{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.88);color:#222;font-size:19px;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:manipulation;-webkit-tap-highlight-color:transparent}#hgMute:active{transform:scale(.94)}#hgMute.st{position:static;flex:0 0 40px;margin:0 0 0 8px}';
    document.head.appendChild(st);
    var b=document.createElement('button'); b.type='button'; b.id='hgMute';
    function paint(){ b.textContent = muted?'🔇':'🔊'; b.setAttribute('aria-pressed', muted?'true':'false');
      b.title = b.ariaLabel = muted ? '開啟音樂和音效 · Activar música y efectos' : '靜音（音樂和音效）· Silenciar música y efectos'; apply(); }
    b.addEventListener('click',function(e){ e.stopPropagation(); muted=!muted; try{ localStorage.setItem(KEY, muted?'1':'0'); }catch(err){} paint(); });
    b.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    paint();
    var anchor = MOUNT && document.querySelector(MOUNT);
    if(anchor && anchor.parentNode){ b.className='st'; anchor.parentNode.insertBefore(b, anchor.nextSibling); } else document.body.appendChild(b);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();
/* ===== /一鍵靜音 ===== */
</script>
<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'come_caracteres';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() })
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
